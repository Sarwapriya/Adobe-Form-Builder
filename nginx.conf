server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxies the backend under this SAME origin/port, so the browser
    # never talks to the backend's own port directly. This is what makes
    # VITE_API_BASE_URL unnecessary (the frontend calls relative /api/... URLs)
    # and sidesteps CORS/cookie-SameSite topology entirely, since frontend and
    # backend appear to the browser as one origin. "formiq-backend" is the
    # backend container's name — both containers must share a Docker network
    # (see Dockerfile/DEPLOYMENT.md) for nginx to resolve it.
    location /api/ {
        proxy_pass http://formiq-backend:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (client-side routing) — any path that isn't a real static
    # file falls back to index.html instead of nginx returning its own 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
