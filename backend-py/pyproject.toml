[project]
name = "formbuilder-backend-py"
version = "0.1.0"
description = "Python (FastAPI) port of the Adobe Form Builder Express/TypeORM backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "pyodbc>=5.1.0",
    "alembic>=1.13.3",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.12",
    "paramiko>=3.5.0",
    "openpyxl>=3.1.5",
    "anthropic>=0.39.0",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "httpx>=0.27.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
